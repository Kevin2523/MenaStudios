<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Ícono de Mena Studios</title>
  <desc id="desc">Monograma blanco MS sobre un fondo oscuro redondeado.</desc>
  <defs>
    <linearGradient id="background" x1="52" y1="35" x2="466" y2="483" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#080E1A"/>
    </linearGradient>
    <radialGradient id="light" cx="0" cy="0" r="1" gradientTransform="translate(128 84) rotate(48) scale(360)">
      <stop stop-color="#FFFFFF" stop-opacity=".13"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#background)"/>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#light)"/>
  <rect x="32" y="32" width="448" height="448" rx="101" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="3"/>

  <!-- Monograma MS derivado de la opción de cinta continua. -->
  <path d="M105 381V151c0-37 44-54 69-26l90 106 87-106c26-30 72-11 72 28v39c0 41-33 63-85 63h-50c-52 0-83 21-83 59 0 40 36 65 88 65h112"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="39"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#shadow)"/>
</svg>
